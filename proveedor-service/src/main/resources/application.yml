server:
  port: ${PORT:8086}
spring:
  application:
    name: proveedor-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/db_proveedores?createDatabaseIfNotExist=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
