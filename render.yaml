# Blueprint de Render para la demostracion EFT.
# Los Dockerfiles compilan el proyecto Maven raiz, por eso cada servicio usa el
# repositorio completo como contexto y su Dockerfile particular.
# Los servicios de negocio se exponen como web para que puedan comunicarse por
# URL publica cuando se use el plan Free. El Gateway es la unica URL que se debe
# presentar al docente.
services:
  - type: web
    name: tienda-gamer-eureka
    runtime: docker
    plan: free
    dockerfilePath: eureka-server/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health

  - type: web
    name: tienda-gamer-usuarios
    runtime: docker
    plan: free
    dockerfilePath: usuario-service/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: EUREKA_URL
        sync: false

  - type: web
    name: tienda-gamer-productos
    runtime: docker
    plan: free
    dockerfilePath: tienda-gamer-service/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: EUREKA_URL
        sync: false

  - type: web
    name: tienda-gamer-inventario
    runtime: docker
    plan: free
    dockerfilePath: inventario-service/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: EUREKA_URL
        sync: false

  - type: web
    name: tienda-gamer-ordenes
    runtime: docker
    plan: free
    dockerfilePath: orden-service/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: EUREKA_URL
        sync: false
      - key: USUARIO_SERVICE_URL
        fromService:
          name: tienda-gamer-usuarios
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: TIENDA_SERVICE_URL
        fromService:
          name: tienda-gamer-productos
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: INVENTARIO_SERVICE_URL
        fromService:
          name: tienda-gamer-inventario
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: tienda-gamer-pagos
    runtime: docker
    plan: free
    dockerfilePath: pago-service/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: EUREKA_URL
        sync: false
      - key: ORDEN_SERVICE_URL
        fromService:
          name: tienda-gamer-ordenes
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: tienda-gamer-categorias
    runtime: docker
    plan: free
    dockerfilePath: categoria-service/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
