          name: tienda-gamer-ordenes
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: PAGO_SERVICE_URL
        fromService:
          name: tienda-gamer-pagos
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: CATEGORIA_SERVICE_URL
        fromService:
          name: tienda-gamer-categorias
