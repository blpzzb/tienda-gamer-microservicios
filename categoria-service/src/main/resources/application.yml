server:
  port: ${PORT:8085}
spring:
  application:
    name: categoria-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/db_categorias?createDatabaseIfNotExist=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
