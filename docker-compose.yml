services:
  eureka-server:
    build:
      context: .
      dockerfile: eureka-server/Dockerfile
    ports:
      - "8761:8761"

  mysql:
    image: mysql:8.0
    container_name: mysql-fullstack
    restart: always
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_ROOT_PASSWORD: ""
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  usuario-service:
    build:
      context: .
      dockerfile: usuario-service/Dockerfile
    container_name: usuario-service
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/db_usuarios?createDatabaseIfNotExist=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: ""
      EUREKA_URL: http://eureka-server:8761/eureka/

  tienda-gamer-service:
    build:
      context: .
      dockerfile: tienda-gamer-service/Dockerfile
    container_name: tienda-gamer-service
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/db_tienda_gamer?createDatabaseIfNotExist=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: ""
      EUREKA_URL: http://eureka-server:8761/eureka/

  inventario-service:
    build:
      context: .
      dockerfile: inventario-service/Dockerfile
    container_name: inventario-service
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/db_inventario?createDatabaseIfNotExist=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: ""
      EUREKA_URL: http://eureka-server:8761/eureka/

  orden-service:
    build:
      context: .
      dockerfile: orden-service/Dockerfile
    container_name: orden-service
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      usuario-service:
        condition: service_started
      tienda-gamer-service:
        condition: service_started
      inventario-service:
        condition: service_started
    ports:
      - "8082:8082"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/db_ordenes?createDatabaseIfNotExist=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: ""
      EUREKA_URL: http://eureka-server:8761/eureka/
      USUARIO_SERVICE_URL: http://usuario-service:8081
      TIENDA_SERVICE_URL: http://tienda-gamer-service:8080
      INVENTARIO_SERVICE_URL: http://inventario-service:8083

  pago-service:
    build:
      context: .
      dockerfile: pago-service/Dockerfile
    container_name: pago-service
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      orden-service:
        condition: service_started
    ports:
      - "8084:8084"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/db_pagos?createDatabaseIfNotExist=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: ""
      EUREKA_URL: http://eureka-server:8761/eureka/
      ORDEN_SERVICE_URL: http://orden-service:8082

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    restart: always
    depends_on:
      usuario-service:
        condition: service_started
      tienda-gamer-service:
        condition: service_started
      inventario-service:
        condition: service_started
      orden-service:
        condition: service_started
      pago-service:
        condition: service_started
    ports:
      - "8090:8090"
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka/
      USUARIO_SERVICE_URL: http://usuario-service:8081
      TIENDA_SERVICE_URL: http://tienda-gamer-service:8080
      INVENTARIO_SERVICE_URL: http://inventario-service:8083
      ORDEN_SERVICE_URL: http://orden-service:8082
      PAGO_SERVICE_URL: http://pago-service:8084
      CATEGORIA_SERVICE_URL: http://categoria-service:8085
      PROVEEDOR_SERVICE_URL: http://proveedor-service:8086
      CARRITO_SERVICE_URL: http://carrito-service:8087
      RESENA_SERVICE_URL: http://resena-service:8088
      NOTIFICACION_SERVICE_URL: http://notificacion-service:8089

  categoria-service:
    build:
      context: .
      dockerfile: categoria-service/Dockerfile
    ports: ["8085:8085"]
    restart: always
    environment: &new_service_env
      DB_URL: jdbc:mysql://mysql:3306/db_categorias?createDatabaseIfNotExist=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: ""
      EUREKA_URL: http://eureka-server:8761/eureka/
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started

  proveedor-service:
    build:
      context: .
      dockerfile: proveedor-service/Dockerfile
    ports: ["8086:8086"]
    restart: always
    environment:
      <<: *new_service_env
      DB_URL: jdbc:mysql://mysql:3306/db_proveedores?createDatabaseIfNotExist=true&serverTimezone=UTC
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started

  carrito-service:
    build:
      context: .
      dockerfile: carrito-service/Dockerfile
    ports: ["8087:8087"]
    restart: always
    environment:
      <<: *new_service_env
      DB_URL: jdbc:mysql://mysql:3306/db_carritos?createDatabaseIfNotExist=true&serverTimezone=UTC
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started

  resena-service:
    build:
      context: .
      dockerfile: resena-service/Dockerfile
    ports: ["8088:8088"]
    restart: always
    environment:
      <<: *new_service_env
      DB_URL: jdbc:mysql://mysql:3306/db_resenas?createDatabaseIfNotExist=true&serverTimezone=UTC
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started

  notificacion-service:
    build:
      context: .
      dockerfile: notificacion-service/Dockerfile
    ports: ["8089:8089"]
    restart: always
    environment:
      <<: *new_service_env
      DB_URL: jdbc:mysql://mysql:3306/db_notificaciones?createDatabaseIfNotExist=true&serverTimezone=UTC
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started

volumes:
  mysql_data:
